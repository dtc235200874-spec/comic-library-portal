services:
  mysql:
    image: mysql:8.4
    container_name: comic-library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:root}
      MYSQL_DATABASE: ${DB_NAME:comic_library}
      MYSQL_USER: ${DB_USERNAME:comic}
      MYSQL_PASSWORD: ${DB_PASSWORD:comic}
    ports:
      - "${DB_PORT:3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
